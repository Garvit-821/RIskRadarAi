<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | RiskRadar AI</title>

    <link rel="stylesheet" href="css/register.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">

</head>

<body>

    <div class="container">

        <div class="left">

            <h1>🌍 RiskRadar AI</h1>

            <p>

                Join RiskRadar AI and monitor weather,
                earthquakes and disaster alerts in real time.

            </p>

        </div>

        <div class="right">

            <form id="registerForm">

                <h2>Create Account</h2>

                <div class="input-box">

                    <i class="fa-solid fa-user"></i>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Full Name"
                        required>

                </div>

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="Email"
                        required>

                </div>

                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        required>

                </div>

                <button type="submit">

                    Register

                </button>

                <p>

                    Already have an account?

                    <a href="login.html">

                        Login

                    </a>

                </p>

            </form>

        </div>

    </div>

<script src="js/register.js"></script>

</body>

</html>
